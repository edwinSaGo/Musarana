name: Publicar Musaraña en GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Reconstruye el sitio automáticamente cada día a las 8am UTC (~3am Colombia)
    # para reflejar cambios de stock/catálogo hechos en el Sheet sin que tengas que hacer push.
    - cron: '0 8 * * *'
  workflow_dispatch: {} # permite lanzar el build manualmente desde la pestaña "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Construir el sitio
        env:
          PUBLIC_APPS_SCRIPT_URL: ${{ secrets.PUBLIC_APPS_SCRIPT_URL }}
          PUBLIC_API_SECRET: ${{ secrets.PUBLIC_API_SECRET }}
        run: npm run build

      - name: Preparar Pages
        uses: actions/configure-pages@v4

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
